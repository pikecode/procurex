<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProcureX · 运营与对账</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar"><div class="brand"><span class="mark">P</span><span>ProcureX<small>采购协同平台</small></span></div><div class="nav-label">工作台</div><a class="nav-item" href="/m4-acceptance.html">M4 验收</a><a class="nav-item" href="/main-flow-demo.html">主流程操作台</a><a class="nav-item" href="/main-flow.html">主流程验收</a><a class="nav-item" href="/billing.html">财务结算</a><a class="nav-item" href="/">报表与分析</a><a class="nav-item active" href="/ops.html">运营与对账</a><div class="side-foot"><span class="pulse"></span>异常只读，不自动改账</div></aside>
  <main class="main">
    <header class="topbar"><div class="crumb">工作台 <span>/</span> 运营与对账</div><div class="profile"><span id="identity">未登录</span><button id="logout" class="quiet hidden">退出</button><span class="avatar">P</span></div></header>
    <section class="page-head"><div><div class="eyebrow">运营状态 · W13</div><h1>运营与对账</h1><p>查看账户、流水与资金占用之间的对账异常；异常只用于人工核查，不自动修正财务事实。</p></div><div class="updated"><span class="pulse"></span>R05 对账异常</div></section>
    <section id="login" class="login-card"><div><h2>登录管理后台</h2><p>使用总部财务或管理员账号查看运营异常。</p></div><form id="login-form"><input name="username" placeholder="用户名" required><input name="password" type="password" placeholder="密码" required><button class="primary">登录</button></form><div id="login-error" class="error"></div></section>
    <section id="workspace" class="hidden">
      <div id="notice" class="notice hidden"></div>
      <section class="summary-grid" id="summary"></section>
      <section class="data-card"><div class="data-head"><div><h3>对账异常</h3><p>余额/流水、挂账占用/资金占用的只读核查结果</p></div><button id="refresh" class="secondary">刷新</button></div><div class="table-wrap"><table><thead><tr><th>门店</th><th>异常类型</th><th class="money">系统记录</th><th class="money">核算值</th><th class="money">差额</th><th>核查依据</th></tr></thead><tbody id="issues"></tbody></table><div id="empty" class="empty hidden"><span>◌</span><strong>暂无对账异常</strong><small>当前账户、流水与资金占用一致</small></div></div></section>
      <footer>R05 只暴露异常，不修改余额、流水或资金占用。</footer>
    </section>
  </main>
  <script src="/ops.js"></script>
</body>
</html>
